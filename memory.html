<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory du chef · Le restaurant d'Antoine</title>
  <meta name="description" content="Retrouve les paires de plats du restaurant d'Antoine en un minimum de coups. Trois niveaux de difficulté.">
  <meta name="theme-color" content="#f6efe4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15100c" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Le restaurant d'Antoine">
  <meta property="og:title" content="Memory du chef · Le restaurant d'Antoine">
  <meta property="og:description" content="Retrouve les paires de plats du restaurant d'Antoine en un minimum de coups. Trois niveaux de difficulté.">
  <meta property="og:image" content="img/accueil.webp">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,0..100;1,9..144,400..700,0..100&family=Manrope:wght@400..800&display=swap">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="jeux.css">
  <script>try{var t=localStorage.getItem("antoine-theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
  <script src="recettes-data.js" defer></script>
  <script src="site.js" defer></script>
  <script src="chatbot.js" defer></script>
  <script src="jeu-memory.js" defer></script>
</head>
<body data-page="games">
  <main id="main" class="container game-page">
    <div class="game-head">
      <div>
        <p class="eyebrow"><a href="jeux.html" style="text-decoration:none">Mini-jeux</a></p>
        <h1>Memory du <em style="color:var(--accent)">chef</em></h1>
        <p class="lead" style="margin-top:10px">Retourne les cartes et retrouve les paires de plats, en un minimum de coups.</p>
      </div>
      <div class="chip-row" id="memLevels" role="group" aria-label="Niveau de difficulté"></div>
    </div>
    <div class="game-board">
      <div class="hud-bar">
        <div class="hud-stat"><span>Coups</span><strong id="memMoves">0</strong></div>
        <div class="hud-stat"><span>Paires</span><strong id="memPairs">0/8</strong></div>
        <div class="hud-stat"><span>Temps</span><strong id="memTime">0:00</strong></div>
        <div class="hud-stat"><span>Record</span><strong id="memBest">–</strong></div>
        <button class="btn btn-sm" type="button" id="memRestart" style="align-self:center">Mélanger</button>
      </div>
      <div class="memory-grid" id="memGrid"></div>
      <div class="game-overlay" id="memOverlay" hidden></div>
    </div>
  </main>
</body>
</html>
